<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bài 4 - Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
    ul { list-style-type: none; padding: 0; margin: 20px; }
    li { display: inline-block; margin-right: 5px; }
    a {
        display: block; padding: 10px 20px; background-color: #4CAF50;
        color: white; text-decoration: none; font-family: Arial, sans-serif;
        font-weight: bold; border-radius: 4px;
    }
    a:hover { background-color: #45a049; }
    a i { margin-right: 8px; } /* Khoảng cách giữa icon và chữ */
</style>
</head>
<body>
    <ul>
        <li><a href="#"><i class="fas fa-shopping-cart"></i>TMDT</a></li>
        <li><a href="#"><i class="fas fa-industry"></i>ERP</a></li>
        <li><a href="#"><i class="fas fa-database"></i>MIS</a></li>
        <li><a href="#"><i class="fas fa-chart-bar"></i>DS</a></li>
    </ul>
</body>
</html>
