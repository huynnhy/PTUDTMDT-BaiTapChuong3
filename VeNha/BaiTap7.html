<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bài 7 Layout</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
    body { font-family: Arial, sans-serif; background-color: #ddd; margin: 0; padding: 20px; }
    #wrapper {
        width: 800px; margin: 0 auto; background-color: white; padding: 10px; border: 2px solid #000;
        display: grid;
        grid-template-areas: "header header" "nav main" "footer footer";
        grid-template-columns: 200px 1fr; gap: 10px;
    }
    header, nav, main, footer { border: 2px solid #000; padding: 20px; font-weight: bold; font-size: 18px; }
    header { grid-area: header; }
    nav { grid-area: nav; height: 300px; }
    main { grid-area: main; height: 300px; }
    footer { grid-area: footer; }
    i { margin-right: 8px; color: #555; }
</style>
</head>
<body>
    <div id="wrapper">
        <header><i class="fas fa-heading"></i>header</header>
        <nav><i class="fas fa-compass"></i>nav</nav>
        <main><i class="fas fa-home"></i>main</main>
        <footer><i class="fas fa-shoe-prints"></i>footer</footer>
    </div>
</body>
</html>
