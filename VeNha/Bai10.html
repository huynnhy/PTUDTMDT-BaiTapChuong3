<head>

    <title>Bài Tập CSS - Tuần 3</title>
    <!-- Nhúng Font Awesome 5 (Theo hướng dẫn từ Viblo) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            padding: 20px; 
            color: #333;
        }
        .profile-card { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .profile-card img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #007bff; 
            margin-bottom: 15px;
        }
        h2 { margin: 0 0 10px 0; color: #2c3e50; }
        .info { font-size: 16px; color: #555; margin-bottom: 20px; }
        .social-links a { 
            display: inline-block;
            margin: 0 10px; 
            color: #555; 
            font-size: 28px; 
            text-decoration: none; 
            transition: 0.3s; 
        }
        .social-links a:hover { color: #007bff; transform: translateY(-3px); }
        .homework-list { 
            text-align: left; 
            margin-top: 30px; 
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }
        .homework-list h3 { color: #2c3e50; }
        .homework-list ul { list-style: none; padding: 0; }
        .homework-list li { 
            margin: 15px 0; 
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            transition: 0.2s;
        }
        .homework-list li:hover { background-color: #e9ecef; }
        .homework-list a { 
            text-decoration: none; 
            color: #007bff; 
            font-weight: bold; 
            font-size: 16px; 
            display: block;
        }
        .homework-list i.fa-link { 
            margin-right: 10px; 
            color: #28a745; 
        }
    </style>
</head>
<body>

<div class="profile-card">
